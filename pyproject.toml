[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duolm"
version = "0.1.0"
description = "Fast and effective personalized recommendation with language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "Jiang Wu"}]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.8,<3",
  "transformers==4.57.1",
  "huggingface-hub==0.36.0",
  "safetensors==0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.urls]
Paper = "https://arxiv.org/abs/2610.24481"
Repository = "https://github.com/jiangLLM/DuoLM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
